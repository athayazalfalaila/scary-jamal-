const mb=$('mb'),mf=$('mf'),mu=$('mu');let au=null;mb.onclick=()=>window.open('https://open.spotify.com/search/Red%20Red%20CORTIS','_blank','noopener');
mu.onclick=()=>{if(!au)mf.click();else if(au.paused){au.play();mu.textContent='📁 Musik nyala'}else{au.pause();mu.textContent='🔇 Musik mati'}};
mf.onchange=()=>{const f=mf.files[0];if(!f)return;if(au){au.pause();URL.revokeObjectURL(au.src)}au=new Audio(URL.createObjectURL(f));au.loop=true;au.volume=.6;au.play().catch(()=>{});mu.textContent='📁 Musik nyala';mf.value=''};
newGame();showName();requestAnimationFrame(loop);
